<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>নির্বাচনী ড্যাশবোর্ড</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>নির্বাচনী ড্যাশবোর্ড</h1>
    <div class="sync-badge">
      <span>⏳</span> Syncing...
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    
    <!-- Input Form Card -->
    <section class="card">
      <form id="voterForm">
        <div class="form-group">
          <label for="voterName">ভোটারের নাম *</label>
          <input type="text" id="voterName" class="form-control" placeholder="নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label for="voterPhone">মোবাইল নম্বর * (১১ ডিজিট)</label>
          <input type="tel" id="voterPhone" class="form-control" placeholder="017XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label for="wardSelect">ওয়ার্ড নম্বর</label>
          <select id="wardSelect" class="form-control">
            <option value="">ওয়ার্ড নির্বাচন করুন</option>
            <option value="Ward 1">ওয়ার্ড ১</option>
            <option value="Ward 2">ওয়ার্ড ২</option>
            <option value="Ward 3">ওয়ার্ড ৩</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">
          💾 সংরক্ষণ করুন
        </button>
      </form>
    </section>

    <!-- Data Display Card -->
    <section class="card">
      <div class="card-header-flex">
        <h2 class="card-title">সংরক্ষিত ডাটা</h2>
        <span class="card-subtitle">প্রদর্শিত: 1 / 1</span>
      </div>

      <div class="filter-grid">
        <input type="text" class="form-control" placeholder="🔍 নাম বা ফোন...">
        <select class="form-control">
          <option value="">সব ওয়ার্ড</option>
          <option value="Ward 1">ওয়ার্ড ১</option>
          <option value="Ward 2">ওয়ার্ড ২</option>
        </select>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>নাম</th>
              <th>ফোন</th>
              <th>ওয়ার্ড</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="voterTableBody">
            <tr>
              <td>Sadman Akand</td>
              <td><a href="tel:01823232020" class="phone-link">01823232020</a></td>
              <td>Ward 2</td>
              <td>
                <div class="action-btn-group">
                  <button class="icon-btn btn-edit">✏️</button>
                  <button class="icon-btn btn-delete">🗑️</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <footer>
    <button class="nav-item">
      <span class="icon">📊</span>
      <span>Excel Export</span>
    </button>
    <button class="nav-item">
      <span class="icon">📄</span>
      <span>PDF Report</span>
    </button>
    <button class="nav-item">
      <span class="icon">📁</span>
      <span>JSON Backup</span>
    </button>
    <button class="nav-item">
      <span class="icon">☁️</span>
      <span>Drive Sync</span>
    </button>
  </footer>

  <!-- Script Import -->
  <script src="script.js"></script>
</body>
</html>
