<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Dashboard</title>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f4f6f9;
    }
    #offline-banner {
      display: none;
      background-color: #f59e0b;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .action-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      margin-right: 5px;
      margin-bottom: 10px;
    }
    .btn-excel { background-color: #16a34a; }
    .btn-json { background-color: #2563eb; }
    .btn-drive { background-color: #ea4335; }
    .form-group {
      margin-bottom: 12px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Offline Banner -->
  <div id="offline-banner">
    ⚠️ আপনি অফলাইনে আছেন। ডাটা মোবাইলে জমা হচ্ছে, ইন্টারনেট আসলে ড্রাইভ সিঙ্ক হবে।
  </div>

  <h2>নির্বাচনী ডাটা ড্যাশবোর্ড</h2>

  <!-- Action Buttons -->
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;">
    <button class="action-btn btn-excel" onclick="exportToExcel()">📊 Excel এ ডাউনলোড</button>
    <button class="action-btn btn-json" onclick="exportToJSON()">📁 JSON ব্যাকআপ</button>
    <button class="action-btn btn-drive" onclick="syncWithGoogleDrive()">☁️ Google Drive সিঙ্ক</button>
  </div>

  <!-- Form Area -->
  <form id="voterForm" onsubmit="event.preventDefault();">
    <div class="form-group">
      <label for="voterName">ভোটারের নাম:</label>
      <input type="text" id="voterName" oninput="autoSaveFormInput('voterName')" placeholder="নাম লিখুন">
    </div>

    <div class="form-group">
      <label for="wardNo">ওয়ার্ড নম্বর:</label>
      <select id="wardNo" onchange="autoSaveFormInput('wardNo')">
        <option value="">ওয়ার্ড নির্বাচন করুন</option>
        <option value="Ward 1">ওয়ার্ড ১ (কৈতরীপাড়া, সহশ্রাম, আতরতোপা)</option>
        <option value="Ward 2">ওয়ার্ড ২</option>
        <option value="Ward 3">ওয়ার্ড ৩</option>
      </select>
    </div>
  </form>

  <!-- External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
